services:
  app:
    build: .
    restart: unless-stopped
    environment:
      NODE_ENV: production
      ALLOW_DEMO: "false"
      PUBLIC_ORIGIN: https://${APP_DOMAIN:?Set APP_DOMAIN to your real school domain}
    volumes:
      - lexiclass_data:/app/data
    expose:
      - "3000"
  caddy:
    image: caddy:2
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN to your real school domain}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
volumes:
  lexiclass_data:
  caddy_data:
  caddy_config:
