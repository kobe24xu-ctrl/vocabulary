# Replace words.school.example in BOTH server blocks with the real domain.
# Obtain a trusted certificate through your cloud provider before enabling.
server {
    listen 80;
    server_name words.school.example;
    return 301 https://words.school.example$request_uri;
}

server {
    listen 443 ssl;
    server_name words.school.example;
    ssl_certificate /etc/nginx/ssl/lexiclass/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/lexiclass/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:LexiClassTLS:10m;
    client_max_body_size 1m;
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache off;
    }
}
